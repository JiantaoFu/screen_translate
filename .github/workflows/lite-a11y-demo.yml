# Lite accessibility-disclosure demo video on a hosted emulator (KVM).
# Builds the lite debug APK, drives the app with adb/uiautomator
# (tools/a11y_demo/ci_a11y_demo.sh) and uploads the screenrecord as an
# artifact. No secrets: debug build, debug signing.
name: lite-a11y-demo

on:
  push:
    branches: [fix/lite-a11y-disclosure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-a11y-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT_DIR: ${{ github.workspace }}/build/a11y-demo
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Build lite debug APK (x86_64)
        run: |
          flutter pub get
          (cd android && gradle wrapper --gradle-version 8.11.1)
          python tools/build.py emulator --flavor lite
          ls -l build/app/outputs/apk/lite/debug/app-lite-debug.apk

      - name: Record demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2400
          disable-animations: true
          script: bash tools/a11y_demo/ci_a11y_demo.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-a11y-demo
          path: |
            build/a11y-demo/a11y_demo.mp4
            build/a11y-demo/steps.txt
            build/a11y-demo/steps/
            build/a11y-demo/logcat.txt
          if-no-files-found: warn
