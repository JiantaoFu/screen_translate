# Lite short-video screen recordings (adb screenrecord) on a hosted emulator.
# Based on lite-screenshots.yml. (Linux runners have KVM).
#
# Trigger: push to ci/lite-shorts. workflow_dispatch only shows up once
# this file is on the default branch (main), which it deliberately is not, so
# for now: push (or re-push an empty commit) to ci/lite-shorts to run it.
#
# Output artifacts: raw 1080x2400 captures, composed 1080x1920 screenshots
# (1 manga, 2 game, 3 webtoon, 4 chat, 5 home), the home quota text, the
# vertical-Japanese OCR check and logcat. No secrets are used: the lite APK
# is a debug build (debug signing), x86_64 only.
name: lite-shorts

on:
  push:
    branches: [ci/lite-shorts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT_DIR: ${{ github.workspace }}/build/lite-shorts
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradlew isn't committed (Flutter's android/.gitignore); tools/build.py
      # runs android/gradlew, so generate it at the pinned version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fonts and Pillow (compose step)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install pillow

      - name: Build lite debug APK (x86_64)
        run: |
          flutter pub get   # writes android/local.properties, which settings.gradle reads
          (cd android && gradle wrapper --gradle-version 8.11.1)
          python tools/build.py emulator --flavor lite
          ls -l build/app/outputs/apk/lite/debug/app-lite-debug.apk

      - name: Capture on emulator
        id: capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2400
          disable-animations: true
          script: SCENES= bash tools/store_assets/ci_lite_shorts.sh   # offline takes only (online takes are in run 39222442772)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-shorts
          path: build/lite-shorts/
          if-no-files-found: warn
