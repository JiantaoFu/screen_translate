# Unit tests on every pull request, and on main once a change lands. The
# emulator regression (tools/emulator/run_all.sh) needs a real emulator
# session and is run locally.
#
# `push` is limited to main on purpose. An unfiltered `push` fires on every
# branch and tag as well, so a branch with an open PR ran the whole suite
# twice for the same code, and a release tag ran it a third time on the
# commit main had already tested. The pull_request run is the one worth
# keeping: it tests the merge result (main merged into the branch), so it
# also catches a branch that is green alone and broken once merged, which a
# push run on the branch tip cannot see.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; nothing is learned from finishing a
# run against code that has already been replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # gradlew isn't committed (Flutter's android/.gitignore); use the
      # version pinned in gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get   # writes android/local.properties for the Flutter Gradle plugin
      - run: gradle :app:testDebugUnitTest
        working-directory: android

  release-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-release.txt
      - run: python tools/test_release.py
