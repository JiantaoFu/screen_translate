plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new java.io.InputStreamReader(new java.io.FileInputStream(localPropertiesFile), 'UTF-8'))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

// Each flavor's own versionCode, written by tools/build.py; falls back to
// the shared flutter.versionCode when the key isn't there.
// A closure, not a method: a method in a Gradle script can't see the
// script's `def` locals (localProperties, flutterVersionCode).
def flavorVersionCode = { flavor ->
    (localProperties.getProperty("flutter.versionCode.${flavor}")
        ?: flutterVersionCode).toInteger()
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.lomoware.screen_translate"
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.javaVersion.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.lomoware.screen_translate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // -Pabi=arm64-v8a -Pdisable-abi-filtering=true (tools/build.py) packs one
        // ABI into a single APK.
        // Unlike Flutter's split-per-abi it keeps versionCode as-is, so a
        // sideloaded build doesn't end up above Play's (e.g. 2011 vs 11).
        if (project.hasProperty('abi')) {
            ndk { abiFilters project.property('abi') }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // One codebase, two Play listings. tools/build.py --flavor picks one
    // (default paid) and passes the same name to Dart as APP_FLAVOR.
    //  paid: com.lomoware.screen_translate, unchanged; the BILLING permission
    //        that in_app_purchase merges in is removed (src/paid manifest).
    //  lite: com.lomoware.screen_translate.lite, daily free limit plus a
    //        one-time "pro_unlock" Play Billing purchase.
    flavorDimensions "edition"
    productFlavors {
        // versionCode is per flavor: releasing one app must not consume the
        // other's build numbers. tools/build.py writes each flavor's own
        // number from pubspec.yaml as flutter.versionCode.<flavor>; the
        // fallback is the plain flutter.versionCode in defaultConfig, so a
        // tree synced by an older build.py still builds.
        paid {
            dimension "edition"
            applicationId "com.lomoware.screen_translate"
            manifestPlaceholders = [appLabel: "Screen Translate"]
            versionCode flavorVersionCode('paid')
        }
        lite {
            dimension "edition"
            applicationId "com.lomoware.screen_translate.lite"
            manifestPlaceholders = [appLabel: "Screen Translator Lite"]
            versionCode flavorVersionCode('lite')
            // Native debug symbols in BUNDLE-METADATA made up ~57 MB
            // (compressed) of the ~146 MB lite AAB: whole copies of the
            // prebuilt .so files (onnxruntime, translate_jni, flutter,
            // libapp) for every ABI. Devices never download BUNDLE-METADATA
            // and the libs inside the APKs are already stripped, so dropping
            // them changes nothing on device.
            //
            // Lite only, deliberately. paid keeps its symbols: that is the
            // app whose native crashes we triage in Play Console, and the
            // SIGILLs inside libonnxruntime.so are unreadable without them.
            ndk { debugSymbolLevel 'NONE' }
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '../screen-trans-key.keystore')
            storePassword keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'screen-trans'
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            def keystoreFile = file(keystoreProperties['storeFile'] ?: '../screen-trans-key.keystore')
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                println "WARNING: Release keystore not found at ${keystoreFile.absolutePath}. Falling back to DEBUG signing config for local testing."
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
        implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
        implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'
        implementation 'com.google.mlkit:text-recognition-japanese:16.0.0'
        implementation 'com.google.mlkit:text-recognition-korean:16.0.0'
        implementation 'com.google.mlkit:translate:17.0.3'
        // in_app_review pulls core-common 2.0.2, whose PlayCoreDialogWrapperActivity
        // NPEs in onCreate when recreated without extras (Crashlytics, 1.2.0).
        implementation 'com.google.android.play:review:2.0.2'
        implementation 'com.google.android.play:core-common:2.0.4'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:3.11.2'
        testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.5.21'
        testImplementation 'org.mockito:mockito-inline:3.11.2'
        testImplementation 'org.mockito:mockito-core:5.3.1'
        testImplementation 'org.robolectric:robolectric:4.10.3'
        testImplementation 'uk.org.lidalia:slf4j-test:1.2.0'
    }
}

flutter {
    source = "../.."
}

// Firebase config for the lite package lives in src/lite/google-services.json
// (the paid one stays at android/app/google-services.json; the plugin prefers
// src/<flavor>/ when present)
// (not in the repo until Jiantao downloads it from the Firebase console; see
// android/app/src/lite/README.md). The root google-services.json only has the
// paid package, so without the lite file the google-services task would fail.
// For local/debug builds we skip that task and the app runs with Firebase
// disabled (Remote Config defaults, no analytics); tools/build.py refuses a
// lite *release* build without the real file.
def liteGoogleServices = file('src/lite/google-services.json')
if (!liteGoogleServices.exists()) {
    println "WARNING: ${liteGoogleServices} is missing: lite builds run without Firebase " +
            "(see android/app/src/lite/README.md)."
    tasks.configureEach { task ->
        if (task.name ==~ /process(Lite)\w*GoogleServices/ ||
                task.name ==~ /\w*[Ll]ite\w*[Cc]rashlytics\w*/) {
            task.enabled = false
        }
    }
}

// Pre-flavor task name kept so `./gradlew :app:testDebugUnitTest` (CLAUDE.md,
// tools/release.py) still runs every Kotlin unit test.
tasks.register('testDebugUnitTest') {
    group = 'verification'
    description = 'Runs the debug unit tests of every flavor.'
    dependsOn 'testPaidDebugUnitTest', 'testLiteDebugUnitTest'
}
